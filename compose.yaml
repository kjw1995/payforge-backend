# payforge 개발용 MySQL. 접속 정보는 .env 에 있다(.env.example 참고).
#   기동: docker compose up -d
#   접속: 다른 PC → jdbc:mysql://100.109.120.75:3308/payforge (Tailscale), 이 PC → jdbc:mysql://127.0.0.1:3308/payforge
name: payforge

services:
  mysql:
    image: mysql:8.4
    container_name: payforge-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # root 는 컨테이너 안에서만 쓴다. 원격 접속은 MYSQL_USER 계정으로 한다.
      MYSQL_ROOT_HOST: localhost
      TZ: Asia/Seoul
    ports:
      # 이 PC 는 공인 IP 에 직접 붙어 있어 0.0.0.0 으로 열면 인터넷에 노출된다. 루프백과 Tailscale IP 에만 바인딩한다.
      # NCP SSL VPN 이 켜져 있으면 자기 Tailscale IP 로 가는 경로를 VPN 이 가져가서 이 PC 에서는 127.0.0.1 로 붙어야 한다.
      - "127.0.0.1:${MYSQL_PORT}:3306"
      - "${MYSQL_BIND}:${MYSQL_PORT}:3306"
    volumes:
      - payforge-mysql:/var/lib/mysql
    healthcheck:
      # 초기화 중 임시 서버는 TCP 를 열지 않으므로 127.0.0.1 로 붙어야 실제 기동 완료를 판별할 수 있다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  payforge-mysql:
