spring:
  application:
    name: payforge-backend

  # DB 접속 정보는 compose.yaml 과 같은 .env 에서 읽는다. 환경변수로 넘기면 그쪽이 우선한다.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:100.109.120.75}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:payforge}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:payforge}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
